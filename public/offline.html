<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120c09">
<meta name="robots" content="noindex">
<title>PromptjiCode Interview</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  html, body { margin: 0; min-height: 100%; background: #120c09; color: #fbf1e4; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; color: #b9a593; line-height: 1.7; }
  .en { direction: ltr; font-size: .9rem; }
  button { margin-top: .5rem; border: 0; border-radius: .75rem; background: #e2a15c; color: #120c09; font: inherit; font-weight: 700; padding: .7rem 1.6rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>الاختبار يحتاج إلى اتصال. تحقّق من الشبكة وحاول مرة أخرى.</p>
  <p class="en">You're offline. Check your connection and try again.<br>Çevrimdışısınız. Bağlantınızı kontrol edip tekrar deneyin.</p>
  <button type="button" onclick="location.reload()">حاول مرة أخرى</button>
</main>
<script>addEventListener('online', () => location.reload())</script>
</body>
</html>
